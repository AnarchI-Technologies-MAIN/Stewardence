name: Stewardence production smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stewardence-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      STEWARDENCE_BASE_URL: https://web-production-ef568.up.railway.app
      STEWARDENCE_SMOKE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out the verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: 0.12.9
          enable-cache: true

      - name: Install locked application dependencies
        run: uv sync --frozen --only-group renderer

      - name: Install the pinned Chromium runtime
        run: uv run --no-sync playwright install --with-deps chromium

      - name: Verify the complete production journey
        run: uv run --no-sync python scripts/production_smoke.py
