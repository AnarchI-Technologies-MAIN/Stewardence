name: agentledger-development

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: agentledger_dev
      POSTGRES_USER: agentledger
      POSTGRES_PASSWORD: agentledger
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentledger -d agentledger_dev"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentledger_postgres_data:/var/lib/postgresql

  renderer:
    build:
      context: .
      dockerfile: Dockerfile.renderer
    read_only: true
    user: "10001:10001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/playwright-seccomp.json
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /work/output:size=128M,mode=0700,uid=10001,gid=10001
    pids_limit: 256
    mem_limit: 768m
    cpus: 1.0
    shm_size: 256m
    networks:
      - renderer_net
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

networks:
  renderer_net:
    internal: true

volumes:
  agentledger_postgres_data:
